<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="960" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D1420"/>
      <stop offset="1" stop-color="#141B2B"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B57"/>
      <stop offset="1" stop-color="#E8503C"/>
